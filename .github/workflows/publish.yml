name: Build and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --token "${{ secrets.PYPI_TOKEN }}"
